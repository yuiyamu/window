<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Windows Classic Window Generator</title>
    <script src="./winclassic-window.js"></script>
    <script src="./download.js"></script>
    <style>
      *, *:before, *:after {
        box-sizing: inherit;
      }

      #preview {
        display: inline-block;
        overflow: hidden;
        padding: 1ex;
        resize: both;
        border: 2px inset black;
        background-color: #808080;
      }

      .colors {
        display: flex;
        flex-wrap: wrap;
      }

      .colors label,
      .controls label {
        display: block;
      }

      .reset-button {
        float: right;
      }

      label {
        white-space: nowrap;
      }

      .input-group {
        border-style: solid;
        border-width: 1px;
        padding: 0.5ex 1ex;
      }

      .input-group + .input-group {
        margin-top: 1ex;
      }

      summary {
        font-weight: bold;
      }

      dialog {
        box-sizing: border-box;
      }

      dialog h2 {
        margin-top: 0;
      }

      .import-colors-dialog textarea {
        width: 100%;
      }

      .actions-container {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <!--
      Put dialog here because Pale Moon renders dialogs where they're inserted,
      but attempting to use position: fixed with centering causes issues in Chromium.
    -->
    <dialog id="import-colors-dialog" class="import-colors-dialog" closedby="any">
      <h2>Import colors</h2>
      <p>
        Paste the contents of the <strong><code>[Control Panel\Colors]</code></strong> section of an existing Windows <code>.theme</code> file.<br />
        Alternatively, use the <a href="https://tpenguinltg.github.io/winclassic/">Windows Classic Theme Designer</a>.
      </p>
      <form id="import" method="dialog">
        <textarea name="import-colors-text" rows="30" cols="80" autofocus="autofocus"></textarea>
        <div class="actions-container">
          <button id="import-import-button" value="import">Import</button>
          <button id="import-cancel-button" type="button" value="cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <h1>Windows Classic Window Generator</h1>
    <form id="inputs">
      <fieldset>
        <legend>Customize</legend>
        <input id="reset" type="reset" class="reset-button" />

        <details open="open" class="input-group">
          <summary>Dimensions</summary>
          <label>Width <input id="width" type="number" value="800" min="0" /></label>
          <label>Height <input id="height" type="number" value="400" min="0" /></label>
          <label>Scale <input id="scale" type="number" value="2" min="0" step="any" /></label>
          <label><input id="maximized" type="checkbox" /> Maximized</label>
        </details>

        <details class="controls input-group">
          <summary>Controls</summary>
          <label><input id="show-scrollbar" type="checkbox" checked="checked" /> Scrollbar</label>
          <label><input id="show-status" type="checkbox" checked="checked" /> Status bar</label>
          <label><input id="show-resize" type="checkbox" checked="checked" /> Resize grip</label>
          <label><input id="show-minimize" type="checkbox" checked="checked" /> Minimize button</label>
          <label><input id="show-maximize" type="checkbox" checked="checked" /> Maximize button</label>
          <label><input id="show-close" type="checkbox" checked="checked" /> Close button</label>
        </details>

        <details class="input-group">
          <summary>Colors</summary>
          <button id="import-colors-button" type="button">Import</button>
          <div class="palette">
            Palette:
            <label><input id="palette-active" type="radio" name="palette" value="active" checked="checked" /> Active</label>
            <label><input id="palette-inactive" type="radio" name="palette" value="inactive" /> Inactive</label>
          </div>
          <div class="colors">
            <fieldset>
              <legend>Button</legend>
              <label><input type="color" name="ButtonDkShadow" id="ButtonDkShadow" class="color-item" data-item="ButtonDkShadow"/> ButtonDkShadow</label>
              <label><input type="color" name="ButtonFace" id="ButtonFace" class="color-item" data-item="ButtonFace"/> ButtonFace</label>
              <label><input type="color" name="ButtonHilight" id="ButtonHilight" class="color-item" data-item="ButtonHilight"/> ButtonHilight</label>
              <label><input type="color" name="ButtonLight" id="ButtonLight" class="color-item" data-item="ButtonLight"/> ButtonLight</label>
              <label><input type="color" name="ButtonShadow" id="ButtonShadow" class="color-item" data-item="ButtonShadow"/> ButtonShadow</label>
              <label><input type="color" name="ButtonText" id="ButtonText" class="color-item" data-item="ButtonText"/> ButtonText</label>
            </fieldset>

            <fieldset>
              <legend>Window</legend>
              <label><input type="color" name="AppWorkspace" id="AppWorkspace" class="color-item" data-item="AppWorkspace"/> AppWorkspace</label>
              <label><input type="color" name="Window" id="Window" class="color-item" data-item="Window"/> Window</label>
            </fieldset>

            <fieldset>
              <legend>Title Bar</legend>
              <label><input type="color" name="ActiveTitle" id="ActiveTitle" class="color-item" data-item="ActiveTitle"/> ActiveTitle</label>
              <label><input type="color" name="GradientActiveTitle" id="GradientActiveTitle" class="color-item" data-item="GradientActiveTitle"/> GradientActiveTitle</label>
              <label><input type="color" name="GradientInactiveTitle" id="GradientInactiveTitle" class="color-item" data-item="GradientInactiveTitle"/> GradientInactiveTitle</label>
              <label><input type="color" name="InactiveTitle" id="InactiveTitle" class="color-item" data-item="InactiveTitle"/> InactiveTitle</label>
            </fieldset>
          </div>
        </details>

      </fieldset>
    </form>
    <div>
      <button id="download-svg">Download SVG</button>
      <button id="download-png">Download PNG</button>
      <label>Content size: <output id="content-size"></output></label>
    </div>
    <div id="preview"></div>
    <output for="width height"><textarea id="output" readonly="readonly" rows="24" cols="80" style="width: 100%"></textarea></output>

    <script>
      const widthInput = document.getElementById("width");
      const heightInput = document.getElementById("height");
      const scaleInput = document.getElementById("scale");
      const scrollbarInput = document.getElementById("show-scrollbar");
      const resizeInput = document.getElementById("show-resize");
      const statusInput = document.getElementById("show-status");
      const showMinimizeInput = document.getElementById("show-minimize");
      const showMaximizeInput = document.getElementById("show-maximize");
      const showCloseInput = document.getElementById("show-close");
      const maximizedInput = document.getElementById("maximized");
      const paletteInputGroup = document.forms.inputs.elements.palette;
      const previewOutput = document.getElementById("preview");
      const codeOutput = document.getElementById("output");
      const contentSizeOutput = document.getElementById("content-size");
      const resetButton = document.getElementById("reset");
      const downloadSVGButton = document.getElementById("download-svg");
      const downloadPNGButton = document.getElementById("download-png");
      const colorPickers = Array.from(document.getElementsByClassName("color-item"));
      const importColorsButton = document.getElementById("import-colors-button");
      const importColorsDialog = document.getElementById("import-colors-dialog");
      let svg;

      function addXMLDeclaration(code) {
        return '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + code;
      }

      function createColorsObject(colorPickers) {
        return colorPickers.reduce((pickers, picker) => Object.assign(pickers, { [picker.dataset.item]: picker.value }), {});
      }

      function parseIniContent(content) {
        return content.split('\n').reduce(function(items, line) {
          var parsed = line.match(/^\s*([A-Za-z]+)\s*=\s*((?:[1-9]|1\d|2[0-4])?\d|25[0-5])\s*((?:[1-9]|1\d|2[0-4])?\d|25[0-5])\s*((?:[1-9]|1\d|2[0-4])?\d|25[0-5])\s*$/);
          if (parsed)
            items[parsed[1]] = rgbToHex(...parsed.slice(2));
          return items;
        }, {});
      }

      function setColors(colors) {
        console.log(colors)
        colorPickers.forEach((picker) => picker.defaultValue = colors[picker.dataset.item]);
      }

      function setDefaultColors() {
        setColors(DEFAULT_COLORS);
      }

      function importColors(iniContent) {
        setColors(parseIniContent(iniContent));
      }

      function update({
        width = widthInput.value,
        height = heightInput.value,
        scale = scaleInput.value,
        showScrollbar = scrollbarInput.checked,
        showResize = resizeInput.checked,
        showStatus = statusInput.checked,
        maximized = maximizedInput.checked,
        palette = paletteInputGroup.value,
        colors = createColorsObject(colorPickers),
        controlBox = {
          minimize: showMinimizeInput.checked,
          maximize: showMaximizeInput.checked,
          close: showCloseInput.checked,
        },
      } = {}) {
        ({
          svg,
          dimensions: { windowTextArea: { width: contentWidth, height: contentHeight } },
        } = createWindowSVG({
          width,
          height,
          scale,
          showScrollbar,
          showResize,
          showStatus,
          maximized,
          palette,
          colors,
          controlBox,
        }));

        widthInput.value = width;
        heightInput.value = height;
        previewOutput.innerHTML = svg;
        previewOutput.style.width = width + "px";
        previewOutput.style.height = height + "px";
        codeOutput.value = addXMLDeclaration(svg);
        contentSizeOutput.value = `${contentWidth}×${contentHeight}`;
      }

      document.forms.inputs.addEventListener("input", () => update());
      document.forms.inputs.addEventListener("change", () => update());
      document.forms.inputs.addEventListener("reset", () => setTimeout(update, 0));
      downloadSVGButton.addEventListener("click", () => downloadSVG(addXMLDeclaration(svg), `window-${widthInput.value}x${heightInput.value}s${scaleInput.value}.svg`));
      downloadPNGButton.addEventListener("click", () => downloadPNG(addXMLDeclaration(svg), `window-${widthInput.value}x${heightInput.value}s${scaleInput.value}.png`, widthInput.value, heightInput.value));
      (new ResizeObserver(([{ contentBoxSize }]) => {
        // contentBoxSize was originally an object, but is now an array.
        const { inlineSize: width, blockSize: height } = Array.isArray(contentBoxSize) ? contentBoxSize[0] : contentBoxSize;
        update({ width, height });
      })).observe(previewOutput);

      importColorsButton.addEventListener("click", () => importColorsDialog.showModal());
      document.forms.import.addEventListener("submit", (e) => {
        const iniContent = e.target.elements["import-colors-text"].value;
        importColors(iniContent);
        update();
        document.forms.import.reset();
      });
      document.forms.import.elements["import-cancel-button"].addEventListener("click", () => {
        document.forms.import.reset();
        importColorsDialog.close();
      });

      setDefaultColors();
      update();
    </script>
  </body>
</html>
